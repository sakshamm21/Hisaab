[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hisaab"
version = "1.0.0"
description = "A local-first personal finance tracker: see where your money goes, budget, and plan."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Saksham Malhotra" }]
keywords = ["finance", "budget", "expense-tracker", "personal-finance", "local-first"]
classifiers = [
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "platformdirs>=4.3",
  "httpx>=0.27",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
window = ["pywebview>=5.3"]
dev = ["pytest>=8.3", "ruff>=0.8", "build>=1.2"]

[project.scripts]
hisaab = "hisaab.cli:main"

[project.urls]
Homepage = "https://github.com/sakshamm21/Hisaab"
Issues = "https://github.com/sakshamm21/Hisaab/issues"

# The built UI (hisaab/static) is not in git; `npm run build` in web/ makes it before packaging.
# `artifacts` includes it anyway, in both the source archive and the wheel.
[tool.hatch.build]
artifacts = ["hisaab/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["hisaab"]

[tool.hatch.build.targets.sdist]
include = ["hisaab", "tests", "web/src", "web/public", "web/index.html", "web/package.json",
           "web/package-lock.json", "web/tsconfig.json", "web/vite.config.ts", "README.md", "LICENSE", "PLAN.md"]
exclude = ["*.pdf", "*.csv", "*.db"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long SQL strings read better unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
